<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Maquete 3D – Campus POLI-UPE Arruda</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1f3a74"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#eef2f7;--fg:#14233b;--mut:#5b6b82;--ac:#1f3a74;--red:#c8102e;--card:rgba(255,255,255,.94);--br:#cdd6e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1522;--fg:#e8eefb;--mut:#9fb0cb;--ac:#8fb0f0;--card:rgba(16,26,43,.94);--br:#2b3b57;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1522;--fg:#e8eefb;--mut:#9fb0cb;--ac:#8fb0f0;--card:rgba(16,26,43,.94);--br:#2b3b57;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;width:310px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px 12px}
#hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
#hd img{height:42px;background:#fff;border-radius:6px;padding:3px}
#hd b{font-size:14px;line-height:1.2;color:var(--ac)}
h4{margin:10px 0 4px;font-size:12px;color:var(--mut);font-weight:600}
.ph{display:flex;gap:4px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--br);border-radius:6px;padding:5px 8px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme=dark] button.on,:root:not([data-theme=light]) button.on{color:#0e1522}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ph button{flex:1}
input[type=range]{width:100%}
#lyr label{display:flex;gap:7px;align-items:center;padding:2px 0;cursor:pointer}
#lyr label.dis{opacity:.4}
#inf{background:var(--bg);border-left:3px solid var(--red);padding:7px 9px;border-radius:4px;margin-top:8px}
#inf b{display:block;margin-bottom:2px}
.vw{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.vw button{flex:1;padding:4px}
#mx{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:250px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:8px 10px}
#mx table{border-collapse:collapse;width:100%;font-size:10px}#mx td,#mx th{padding:2px 3px;border-bottom:1px solid var(--br);text-align:left;vertical-align:middle}
#mx th.cp,#mx td.cp{background:rgba(200,16,46,.12)}#mx tr{cursor:pointer}#mx tr.sel td{outline:1px solid var(--red);outline-offset:-1px}
.ch{display:inline-block;padding:1px 3px;border-radius:4px;font-size:9px;font-weight:700;white-space:nowrap}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(660px,92vw);display:none;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px 14px 14px;font-size:14px}
#cap i{position:absolute;left:0;bottom:0;height:4px;background:var(--red);border-radius:0 0 0 10px;width:0}
@media(max-width:620px){#ui{width:calc(100% - 16px);max-height:48%}#mx{display:none;top:auto;bottom:8px;max-height:45%;width:calc(100% - 16px)}body.mx #mx{display:block}}
.mt{display:flex;gap:3px;margin:4px 0}.mt button{flex:1;padding:2px 3px;font-size:10px}#mx.min #mxt,#mx.min #mxtab,#mx.min small{display:none}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:11px}.lg span{display:flex;gap:5px;align-items:center}.lg u{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none;border:1px solid var(--br)}
#cp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:56px;height:56px;background:var(--card);border:1px solid var(--br);border-radius:50%;pointer-events:none}
#cp i{position:absolute;inset:5px}#cp i::before{content:"";position:absolute;left:50%;top:0;margin-left:-6px;border:6px solid transparent;border-bottom:20px solid var(--red);border-top:0}#cp i b{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:11px;color:var(--red)}

html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#c{touch-action:none}button{touch-action:manipulation}#ui,#mx{touch-action:pan-y;-webkit-overflow-scrolling:touch}
#ut{display:none;margin-left:auto;flex:none;font-size:12px;padding:6px 10px}
@media(pointer:coarse){button{min-height:40px;padding:8px 10px}.mt button{min-height:34px;font-size:12px}#lyr label{padding:7px 0;font-size:14px}#lyr input{width:20px;height:20px}input[type=range]{height:30px}#mx table{font-size:12px}#mx td,#mx th{padding:5px 4px}.ch{font-size:11px}.lg{font-size:12px}#mxc{min-width:40px}}
@media(max-width:900px){#ut{display:block}#mx{display:none}body.mx #mx{display:block;width:min(340px,calc(100% - 16px))}#ui{width:min(310px,calc(100% - 16px))}
#ui.col>h4:nth-of-type(n+2),#ui.col #lyr,#ui.col #lg,#ui.col #inf,#ui.col .vw button:not(#tb):not(#mb){display:none}#ui.col .vw{margin-top:6px}}
@media(min-width:621px) and (max-width:900px){#cap{left:calc(318px + (100% - 326px)/2);width:calc(100% - 336px);font-size:13px}}
@media(max-height:500px){#ui{max-height:calc(100% - 16px - env(safe-area-inset-top,0px))}#cap{font-size:12px;padding:6px 10px 10px}}
@media(max-width:620px){
#ui{top:auto;left:0;right:0;bottom:0;width:auto;max-height:58%;border-radius:14px 14px 0 0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.18)}
body.mx #ui{display:none}
body.mx #mx{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;left:8px;right:8px;width:auto;max-height:calc(100% - 24px - env(safe-area-inset-top,0px))}
#cp{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;right:8px}
#cap{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;left:8px;right:76px;transform:none;width:auto;font-size:13px;padding:8px 10px 12px}}
@supports(height:100dvh){html,body{height:100dvh}}
@media(min-width:621px){#ui{left:calc(8px + env(safe-area-inset-left,0px))}#mx{right:calc(8px + env(safe-area-inset-right,0px))}}
@media(min-width:621px) and (max-width:1100px) and (orientation:portrait){#ui{width:min(340px,44%)}#ui h4,#hd b{font-size:13px}}
</style></head><body>
